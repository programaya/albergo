<div class="sidebar-content">

    <div class="card">

        <!-- SIDEBAR HEADER -->
        <div class="header p-24" fxLayout="row" fxLayoutAlign="start center">

            <!-- USER -->
            <!-- <img [src]="user.avatar" class="avatar mr-16" [alt]="user.name"/> -->
            <span class="h5">Titulo buscador</span>
            <!-- / USER -->

        </div>
        <!-- / SIDEBAR HEADER -->

        <!-- SIDEBAR CONTENT -->
        <div class="content py-16" fusePerfectScrollbar>

            <!-- ESTA OCULTO -->
            <div [formGroup]="habitafiltroGroupSidebar" hidden=true>
                <input formControlName="filtro">
            </div>
            <!-- / ESTA OCULTO -->

            <div class="nav material2">

                <!-- BLOQUE SELECCION -->
                <div class="nav-item" aria-label="inbox">
                    <a class="nav-link" matRipple (click)="cambiaFiltro('todo')"
                       [ngClass]="{'active accent':filtradoPor ==='todo'}">
                        <span class="title">Todos</span>
                    </a>
                </div>

                <div class="nav-item" aria-label="frequently contacted" (click)="cambiaFiltro('Turner')">
                    <a class="nav-link" matRipple [ngClass]="{'active accent':filtradoPor ==='Turner'}">
                        <div class="title">x Turner</div>
                    </a>
                </div>

                <div class="nav-item" aria-label="starred" (click)="cambiaFiltro('Beer')">
                    <a class="nav-link" matRipple [ngClass]="{'active accent':filtradoPor ==='Beer'}">
                        <div class="title">x Beer</div>
                    </a>
                </div>
                <!-- / BLOQUE SELECCION -->

            </div>

        </div>

    </div>

</div>
<!-- / SIDEBAR CONTENT -->
