<div 
  class="drop-zone bg-white"
  [class.drag-over]="isDragOver"
  [class.drag-error]="hasError"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  (click)="triggerFileInput()">
  
  <div class="drop-content">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
    </div>
    
    <h3>{{ title || 'Arrastra y suelta archivos aquí' }}</h3>
    <p>{{ subtitle || 'o haz clic para seleccionar' }}</p>
    
    <div class="file-info" *ngIf="selectedFiles.length > 0">
      <span>{{ selectedFiles.length }} archivo(s) seleccionado(s)</span>
      <span *ngIf="maxSize"> | Máximo: {{ formatFileSize(maxSize) }}</span>
    </div>
  </div>
  
  <input
    #fileInput
    type="file"
    [multiple]="multiple"
    [accept]="accept"
    (change)="onFileSelected($event)"
    style="display: none"
  />
</div>

<!-- Preview de archivos -->
<div class="file-preview" *ngIf="showPreview && selectedFiles.length > 0">
  <div *ngFor="let file of selectedFiles; let i = index" class="file-item">
    <div class="file-icon">
      <span>{{ getFileIcon(file.type) }}</span>
    </div>
    <div class="file-details">
      <span class="file-name">{{ file.name }}</span>
      <span class="file-size">{{ formatFileSize(file.size) }}</span>
    </div>
    <button 
      type="button" 
      class="remove-btn"
      (click)="removeFile(i)"
      aria-label="Eliminar archivo">
      ×
    </button>
  </div>
</div>

<!-- Mensajes de error -->
<div class="error-message" *ngIf="errorMessage">
  {{ errorMessage }}
</div>
