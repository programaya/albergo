<mat-card class="caja-resumen-card" (click)="activarEdicion()">
    <mat-card-content>
        <div fxLayout="row" fxLayoutAlign="space-between center">
            <div class="title">
                <div class="h5">Saldo Inicial</div>

                <div class="number fw-medium" (keydown.enter)="activarEdicion()" (keydown.space)="$event.preventDefault(); activarEdicion()"
                    [title]="puedeEditar ? 'Ingresar saldo inicial' : 'Saldo inicial registrado'"
                    [attr.aria-disabled]="!puedeEditar"
                    [style.cursor]="puedeEditar ? 'pointer' : 'not-allowed'" role="button" tabindex="0">
                    <span>$ {{ getEnteros() }}</span>
                    <sup class="fw-medium ms-1 decimales">,{{ getDecimales() }}</sup>
                </div>
            </div>

            <div class="icon accent">
                <mat-icon>account_balance_wallet</mat-icon>
            </div>
        </div>

        <div class="info mt-16" *ngIf="puedeEditar">
            <span class="sub-title secondary-text">Click para ingresar el saldo inicial por única vez</span>
        </div>
    </mat-card-content>
</mat-card>

<ng-template #modalMontoInicial>
    <h2 mat-dialog-title>Ingresar saldo inicial</h2>
    <form (ngSubmit)="aceptarMonto()">
        <mat-dialog-content>
            <mat-form-field appearance="outline" style="width: 100%">
                <mat-label>Monto inicial</mat-label>
                <input matInput type="number" min="0" step="0.01" [formControl]="montoControl" autocomplete="off">
                <mat-error>Ingresá un monto igual o mayor a cero.</mat-error>
            </mat-form-field>
            <p>Una vez aceptado, el saldo inicial no se podrá modificar.</p>
        </mat-dialog-content>
        <mat-dialog-actions align="end">
            <button mat-button type="button" mat-dialog-close>Cancelar</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="montoControl.invalid">Aceptar</button>
        </mat-dialog-actions>
    </form>
</ng-template>
