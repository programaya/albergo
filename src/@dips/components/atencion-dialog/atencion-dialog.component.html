<div class="atencion-content-wrapper">
    <mat-toolbar matDialogTitle class="mat-warn m-0">

        <mat-toolbar-row fxLayout="row" fxLayoutAlign="space-between center">
            <span class="title dialog-title">{{titulo}}</span>
        </mat-toolbar-row>

    </mat-toolbar>

    <!-- <span *ngIf="icon" [ngClass]="'alert-modal-icon alert-modal-icon-' + iconColor + ' fa fa-' + icon"></span> -->

    <div mat-dialog-content class="p-24 pb-0 m-0">
      <div fxLayout="row" fxLayoutAlign="center center">
            <p>{{linea1}}</p>
            <p>{{linea2}}</p>
            <p>{{linea3}}</p>
        </div>
    </div>

    <div mat-dialog-actions class="m-0 p-16" fxLayout="row" fxLayoutAlign="end center">

        <button 
                mat-button
                class="mr-8"
                (click)="matdialogRef.close(false)"
                aria-label="Cancelar"
                matTooltip="Cancelar">
            {{botonCancela}}
        </button>

        <!-- <div *ngIf="opcion"> -->
          <button 
                  mat-button
                  class="save-button"
                  (click)="matdialogRef.close(true)"
                  aria-label="Salvar">
              {{botonAceptar}}
          </button>
        <!-- </div>   -->

    </div>
</div>
