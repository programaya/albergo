<div id="base" class="page-layout simple left-sidebar inner-sidebar inner-scroll">

    <!-- HEADER -->
    <div class="header accent p-16 p-sm-24" fxLayout="column" fxLayoutAlign="start"
         fxLayout.gt-xs="row" fxLayoutAlign.gt-xs="space-between center">

        <!-- APP TITLE -->
        <div fxLayout="row" fxLayoutAlign="start center">

            <!-- <button mat-icon-button class="sidebar-toggle mr-12" fxHide.gt-sm
                    (click)="toggleSidebar('promo-sidebar')">
                <mat-icon>menu</mat-icon>
            </button> -->

            <div class="logo" fxLayout="row" fxLayoutAlign="start center">
                <mat-icon class="logo-icon mr-16"
                          [@animate]="{value:'*',params:{delay:'50ms',scale:'0.2'}}">monetization_on
                </mat-icon>
                <span class="logo-text h1" [@animate]="{value:'*',params:{delay:'100ms',x:'-25px'}}">
                    Promociones
                </span>
            </div>

        </div>
        <!-- / APP TITLE -->

        <!-- SEARCH -->
        <div class="ml-sm-32" fxLayout="row" fxLayoutAlign="center center" fxFlex>

            <div class="search-wrapper mt-16 mt-sm-0">

                <!-- busqueda -->
                <!-- <div [formGroup]="buscaGroup" class="search" fxFlex fxLayout="row" fxLayoutAlign="start center">
                    <mat-icon>search</mat-icon>
                    <input formControlName="buscar" placeholder="Busqueda">
                </div> -->

            </div>

        </div>
        <!-- / SEARCH -->

    </div>
    <!-- / HEADER -->

    <!-- SELECTED BAR -->
    <!-- <promo-selected-bar class="accent-600" *ngIf="hasSelectedContacts" [@slideInTop]></promo-selected-bar> -->
    <!-- / SELECTED BAR -->

    <!-- CONTENT -->
    <div class="content">

        <!-- SIDEBAR -->
        <!-- <dips-sidebar class="sidebar" name="promo-sidebar" position="left" lockedOpen="gt-sm"> -->

            <!-- SIDEBAR CONTENT -->
            <!-- <div class="content" fusePerfectScrollbar>
                <promo-sidebar [@animate]="{value:'*'}"></promo-sidebar>
            </div> -->
            <!-- / SIDEBAR CONTENT -->

        <!-- </dips-sidebar> -->
        <!-- / SIDEBAR -->

        <!-- CENTER -->
        <div class="center p-24 pb-56 pr-sm-92" dipsPerfectScrollbar>

            <!-- CONTENT -->
            <div class="content">
                <promo-list [source]="source" dipsPerfectScrollbar></promo-list>

                <footer [attr.hidden]="source.total <= source.pageSize ? '' : null"></footer>

                <mat-paginator #paginator
                               [hidePageSize]="true"
                               [length]="source.total"
                               [pageSize]="source.pageSize">
                </mat-paginator>
    
            </div>
            <!-- / CONTENT -->

        </div>
        <!-- / CENTER -->

    </div>
    <!-- / CONTENT-->

</div>

<!-- ADD CONTACT BUTTON -->
<button mat-fab class="accent" id="add-contact-button" (click)="nuevoItem()" aria-label="agrega Informacion"
        [@animate]="{value:'*', params:{delay:'300ms',scale:'.2'}}">
    <mat-icon>add</mat-icon>
</button>
<!-- / ADD CONTACT BUTTON -->
