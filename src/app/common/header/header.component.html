<header class="header-area  bg-white border-radius transition"
    [ngClass]="{'active': isSidebarToggled, 'sticky': isSticky}" [class.component-dark-theme]="themeService.isDark()"
    [class.right-sidebar]="themeService.isRightSidebar()" [class.hide-sidebar]="themeService.isHideSidebar()"
    [class.dark-header]="themeService.isHeaderDark()" [class.card-borderd-theme]="themeService.isCardBorder()"
    [class.rtl-enabled]="themeService.isRTLEnabled()">
    <div class="d-md-flex align-items-center justify-content-between">
        <div class="header-left-side d-flex align-items-center">
            <div class="burger-menu cursor-pointer transition d-xl-none" [ngClass]="{'active': isSidebarToggled}"
                (click)="toggle()">
                <span class="top-bar d-block bg-black transition"></span>
                <span class="middle-bar d-block bg-black transition"></span>
                <span class="bottom-bar d-block bg-black transition"></span>
            </div>
            <div>
                <span class="d-flex align-items-center">
                    <img [src]="cuentaDatos?.foto" alt="cuentaDatos?.nombre" *ngIf="cuentaDatos?.foto"
                        class="cuenta-foto" />
                    <span class="fw-semibold"> {{ cuentaDatos?.nombre }}</span>
                </span>
            </div>
        </div>
        <ul class="header-right-side d-flex align-items-center mt-0 mb-0 pl-0 list-unstyled">
            <!-- <li>
                <button mat-button matTooltip="Tutorial" class="calendar-menu-btn" (click)="mostrarTutorial()"
                    tour="inicio-tutorial"
                    tourText="Al activar Tutorial, iniciarás un recorrido interactivo por las secciones de la pantalla actual, con explicaciones breves sobre cada función."
                    tourTitle="Guía rápida">
                    <i class="material-symbols-outlined">
                        chat_info
                    </i>
                </button>
            </li> -->
            <li>
                <button mat-button matTooltip="Tutorial" class="calendar-menu-btn" (click)="mostrarTutorial()"
                    tour="inicio-tutorial"
                    tourText="Al activar Tutorial, iniciarás un recorrido interactivo por las secciones de la pantalla actual, con explicaciones breves sobre cada función."
                    tourTitle="Guía rápida">
                    <i class="material-symbols-outlined">
                        chat_info
                    </i>
                </button>
            </li>
            <li>
                <button mat-button matTooltip="Tema Claro / Oscuro" class="dark-swtich-btn" (click)="toggleTheme()"
                    tour="gessi-tutorial" tourText="Cambia entre tema claro y oscuro."
                    tourTitle=" Modo de visualización" [tourPriority]="102">
                    <i *ngIf="themeService.isDark()" class="material-symbols-outlined">
                        light_mode
                    </i>
                    <i *ngIf="!themeService.isDark()" class="material-symbols-outlined">
                        dark_mode
                    </i>
                </button>
            </li>
            <li>
                <button mat-button [matMenuTriggerFor]="profileMenu" class="profile-menu-btn" tour="gessi-tutorial"
                    tourText="Gestiona los ajustes de tu perfil personal y los parámetros de la empresa."
                    tourTitle="Ajustes" [tourPriority]="103">
                    <img [src]="avatarFoto" alt="profile-image">
                    <span class="status d-inline-block rounded-circle position-absolute"></span>
                </button>
                <mat-menu class="profile-menu-dropdown" #profileMenu="matMenu" xPosition="before">
                    <div [class.dark-menu]="themeService.isDark() || themeService.isHeaderDark()">
                        <div class="menu-header d-flex align-items-center">
                            <img [src]="avatarFoto" alt="profile-image">
                            <div class="title">
                                <a routerLink="/perfilUsuario" class="d-inline-block fw-medium">
                                    {{ usuarioDatos?.nombre }}
                                </a>
                                <span class="designation d-block text-body">
                                    {{ perfilRol }}
                                </span>
                            </div>
                        </div>
                        <ul class="menu-body pl-0 mb-0 mt-0 list-unstyled">
                            <li class="position-relative transition fw-medium">
                                <i class="material-symbols-outlined">
                                    person
                                </i>
                                Mi Perfil
                                <a routerLink="/perfilUsuario" class="link-btn d-block position-absolute"></a>
                            </li>
                            <mat-divider *ngIf="esAdministrador"></mat-divider>
                            <li *ngIf="esAdministrador" class="position-relative transition fw-medium">
                                <i class="material-symbols-outlined">
                                    settings
                                </i>
                                Administración
                                <a routerLink="/perfilNegocio" class="link-btn d-block position-absolute"></a>
                            </li>
                            <li *ngIf="esAdministrador" class="position-relative transition fw-medium">
                                <i class="material-symbols-outlined">
                                    people
                                </i>
                                Usuarios
                                <a routerLink="/usuarios" class="link-btn d-block position-absolute"></a>
                            </li>
                            <mat-divider *ngIf="esAdministrador"></mat-divider>
                            <li class="position-relative transition fw-medium">
                                <i class="material-symbols-outlined">
                                    palette
                                </i>
                                Tema
                                <a routerLink="/tema" class="link-btn d-block position-absolute"></a>
                            </li>
                            <li class="position-relative transition fw-medium">
                                <i class="material-symbols-outlined">
                                    logout
                                </i>
                                Cerrar Sesion
                                <a routerLink="/sesion/login" class="link-btn d-block position-absolute"></a>
                            </li>
                        </ul>
                    </div>
                </mat-menu>
            </li>
        </ul>
    </div>
</header>
