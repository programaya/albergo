<div class="navbar-header" [ngClass]="dipsConfig.layout.navbar.secondaryBackground">

    <div class="logo">
        <img class="logo-icon" src="assets/images/logos/dips.svg">
        <span class="logo-text">albergo - Admin</span>
    </div>

    <button mat-icon-button class="toggle-sidebar-folded"
            (click)="toggleSidebarFolded()" fxHide.lt-lg>
        <mat-icon>menu</mat-icon>
    </button>

    <button mat-icon-button class="toggle-sidebar-opened"
            (click)="toggleSidebarOpened()" fxHide.gt-md>
        <mat-icon>arrow_back</mat-icon>
    </button>

</div>

<div class="navbar-content" dipsPerfectScrollbar [dipsPerfectScrollbarOptions]="{suppressScrollX: true}"
     [ngClass]="dipsConfig.layout.navbar.primaryBackground">
    <dips-navigation layout="vertical"></dips-navigation>
</div>
