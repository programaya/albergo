<h2 mat-dialog-title>Detalle completo del arqueo</h2>
<mat-dialog-content>
  <dl><div *ngFor="let dato of resumenVisible"><dt>{{ dato[0] }}</dt><dd>{{ dato[1] || '—' }}</dd></div></dl>
  <h3>Movimientos ({{ movimientos.length }})</h3>
  <div class="tabla-scroll"><table>
    <thead><tr><th *ngFor="let titulo of encabezados">{{ titulo }}</th></tr></thead>
    <tbody><tr *ngFor="let movimiento of movimientos; let i = index" [style.color]="colorMovimiento(i)"><td *ngFor="let valor of movimiento">{{ valor || '—' }}</td></tr>
      <tr *ngIf="!movimientos.length"><td [attr.colspan]="encabezados.length">No hay movimientos registrados.</td></tr></tbody>
  </table></div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Salir</button>
  <button mat-stroked-button (click)="exportarCsv()"><mat-icon>download</mat-icon> Exportar CSV</button>
  <button mat-raised-button color="primary" (click)="imprimir()"><mat-icon>print</mat-icon> Imprimir / PDF</button>
</mat-dialog-actions>
