<div id="forgot-password" class="inner-scroll" fxLayout="row" fxLayoutAlign="start">

    <div id="forgot-password-intro" fxFlex fxHide fxShow.gt-xs>

        <div class="logo" [@animate]="{value:'*',params:{scale:'0.2'}}">
            <img src="assets/images/logos/dips.svg">
        </div>

        <div class="title" [@animate]="{value:'*',params:{delay:'50ms',y:'25px'}}">
            Bienvenidos a Albergo !
        </div>

        <div class="description" [@animate]="{value:'*',params:{delay:'100ms',y:'25px'}}">
            Administración de Albergues Transitorios.
        </div>

    </div>

    <div id="forgot-password-form-wrapper" dipsPerfectScrollbar
         [@animate]="{value:'*',params:{delay:'300ms',x:'100%'}}">

        <div id="forgot-password-form">

            <div class="logo" fxHide.gt-xs>
                <img src="assets/images/logos/dips.svg">
            </div>

            <div class="title">RECOBRAR SU CONTRASEÑA</div>

            <form name="forgoPasswordForm" [formGroup]="forgotPasswordForm" novalidate>

                <mat-form-field appearance="outline">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email">
                    <mat-icon matSuffix class="secondary-text">mail</mat-icon>
                    <mat-error *ngIf="f.email.errors && f.email.errors.required">
                        Email es requerido
                    </mat-error>
                    <mat-error *ngIf="f.email.errors && f.email.errors.email">
                        Ingrese email valido
                    </mat-error>
                </mat-form-field>

                <div class="error" fxLayout="row" fxLayoutAlign="center center">
                    <mat-error *ngIf="errorOlvido != ''">
                        {{ 'OLVIDO.' + errorOlvido | translate }}
                    </mat-error>

                </div>

                <button mat-raised-button class="submit-button" color="accent"
                        aria-label="SEND RESET LINK" [disabled]="forgotPasswordForm.invalid" (click)="haceReset(forgotPasswordForm.value)">
                    ENVIAR RESET LINK
                </button>

            </form>

            <div class="login" fxLayout="row" fxLayoutAlign="center center">
                <a class="link" [routerLink]="'/sesion/login'">Volver a Inicio</a>
            </div>

        </div>
    </div>
</div>
