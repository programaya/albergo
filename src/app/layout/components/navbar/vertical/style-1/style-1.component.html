<div class="navbar-top" [ngClass]="dipsConfig.layout.navbar.secondaryBackground">

    <div class="logo">
        <img class="logo-icon" src="assets/images/logos/dips.svg">
        <span class="logo-text secondary-text">Albergo</span>

    </div>

    <div class="buttons">

        <button mat-icon-button class="toggle-sidebar-folded"
                (click)="toggleSidebarFolded()" fxHide.lt-lg>
            <mat-icon class="secondary-text">menu</mat-icon>
        </button>

        <button mat-icon-button class="toggle-sidebar-opened"
                (click)="toggleSidebarOpened()" fxHide.gt-md>
            <mat-icon class="secondary-text">arrow_back</mat-icon>
        </button>

    </div>

</div>


<div class="navbar-scroll-container" [ngClass]="dipsConfig.layout.navbar.primaryBackground"
     dipsPerfectScrollbar [dipsPerfectScrollbarOptions]="{suppressScrollX: true}">


    <!-- Encabezado de Usuario --> 
    <div class="user" fxLayout="column" [ngClass]="dipsConfig.layout.navbar.secondaryBackground">
        
        <span class="logo-text secondary-text">v. {{version}}</span>
        
        <!-- <div class="h3 username">{{cuenta.nombre}}</div>
        <div class="h5 email hint-text mt-8">{{parametros.emailEncargado}}</div>
        <div *ngIf="cuenta.foto" class="avatar-container" [ngClass]="dipsConfig.layout.navbar.primaryBackground">
            <img *ngIf="cuenta.foto" class="avatar" src={{cuenta.foto}}>
        </div> -->

    </div>

    <div class="navbar-content">
        <dips-navigation class="material2" layout="vertical"></dips-navigation>
    </div>

</div>
