<div id=items>
    <!-- <mat-datasource [dataSource]="tabla"> -->
        <mat-table class="items-table"
                       #table [dataSource]="tabla"
                       matSort
                       start="desc" 
                       #sort="matSort"
                       [@animateStagger]="{value:'50'}"
                       dipsPerfectScrollbar>


            <!-- Tipo -->


            <!-- Nombre    -->
            <ng-container matColumnDef="nombre">
                <mat-header-cell *matHeaderCellDef>Habitación</mat-header-cell>
                <mat-cell *matCellDef="let item">
                    <p class="text-truncate">{{item.nombre}}</p>
                </mat-cell>
            </ng-container>

            <!-- Fecha Salida    -->
            <ng-container matColumnDef="entrada">
                <mat-header-cell *matHeaderCellDef>Entrada</mat-header-cell>
                <mat-cell *matCellDef="let item">
                    <!-- <p class="text-truncate">{{item.fechaFin}}</p> -->
                    <p class="text-truncate" *ngIf="item.salida != 0">{{item.entrada |date:"dd/MM HH:mm"}}</p>
                </mat-cell>
            </ng-container>

           <!-- Tiempo    -->
            <ng-container matColumnDef="tiempo">
                <mat-header-cell *matHeaderCellDef>Min</mat-header-cell>
                <mat-cell *matCellDef="let item">
                    <p class="text-truncate">{{item.tiempo}}</p>
                 </mat-cell>
            </ng-container>

            <!-- IMPORTE    -->
            <ng-container matColumnDef="importe">
                <mat-header-cell *matHeaderCellDef mat-sort-header>Importe</mat-header-cell>
                <mat-cell *matCellDef="let item">
                    <p class="text-truncate">{{item.importe | currency: '$'}}</p>
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns; sticky:true"></mat-header-row>
            <mat-row *matRowDef="let fila; columns: displayedColumns;"
                    class="fila"
                    (click)="editaItem(fila)"
                    matRipple
                    [@animate]="{value:'*',params:{y:'100%'}}">
            </mat-row>
        </mat-table>
    <!-- </mat-datasource> -->
</div>
