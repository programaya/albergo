<div id="login" class="inner-scroll" fxLayout="row" fxLayoutAlign="start">

    <div id="login-intro" fxFlex fxHide fxShow.gt-xs>

        <div class="logo" [@animate]="{value:'*',params:{scale:'0.2'}}">
            <img src="assets/images/logos/dips.svg">
        </div>

        <div class="title" [@animate]="{value:'*',params:{delay:'50ms',y:'25px'}}">
            Bienvenidos a Albergo ! 
        </div>

        <div class="description" [@animate]="{value:'*',params:{delay:'100ms',y:'25px'}}">
            Administración de Albergues Transitorios.
        </div>

    </div>

    <div id="login-form-wrapper" dipsPerfectScrollbar
         [@animate]="{value:'*',params:{delay:'300ms',x:'100%'}}">

        <div id="login-form">

            <div class="logo" fxHide.gt-xs>
                <img src="assets/images/logos/dips.svg">
            </div>

            <div class="title">INGRESE A SU CUENTA</div>

            <form name="loginForm" [formGroup]="loginForm" novalidate>

                <mat-form-field appearance="outline">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email">
                    <mat-icon matSuffix class="secondary-text">mail</mat-icon>
                    <mat-error *ngIf="f.email.errors && f.email.errors.required">
                        Email es requerido
                    </mat-error>
                    <mat-error
                        *ngIf="f.email.errors && 
                               !f.email.errors.required &&
                                f.email.errors.email">
                        Ingrese un email valido
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Contraseña</mat-label>
                    <input matInput type="password" formControlName="password">
                    <mat-icon matSuffix class="secondary-text">vpn_key</mat-icon>
                    <mat-error>
                        Contraseña es requerida
                    </mat-error>
                </mat-form-field>

                <div class="error" fxLayout="row" fxLayoutAlign="center center">
                    <mat-error *ngIf="errorLogin != ''">
                        {{ 'LOGIN.' + errorLogin | translate }}
                    </mat-error>

                </div>

                <div class="remember-forgot-password" fxLayout="row" fxLayout.xs="column"
                     fxLayoutAlign="space-between center">
                    <!-- <mat-checkbox class="remember-me" aria-label="Remember Me" formControlName="remember">
                        Remember Me
                    </mat-checkbox> -->

                    <a class="forgot-password" [routerLink]="'/sesion/olvido'">
                        Olvido de Contraseña?
                    </a>
                </div>

                <button mat-raised-button color="accent" class="submit-button" aria-label="LOGIN"
                        [disabled]="loginForm.invalid" (click)="conMail(loginForm.value)">
                    INGRESAR
                </button>

            </form>

            <!-- <div class="separator">
                <span class="text">O</span>
            </div>

            <div fxLayout="column" fxLayoutAlign="start center">

                <button mat-raised-button class="google" (click)="google()">
                    Iniciar con Google
                </button> -->

                <!-- <button mat-raised-button class="facebook">
                    Log in with Facebook
                </button> -->

            <!-- </div> -->

            <div class="register" fxLayout="column" fxLayoutAlign="center center">
                <span class="text">No tiene una cuenta?</span>
                <a class="link" [routerLink]="'/sesion/register'">Crear una cuenta</a>
            </div>
        </div>
    </div>
</div>
