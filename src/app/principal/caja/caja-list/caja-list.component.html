        <div id=items>
            <mat-datasource [dataSource]="source">
                <mat-table class="items-table"
                       #table [dataSource]="source"
                       matSort
                       start="desc" 
                       #sort="matSort"
                       [@animateStagger]="{value:'50'}"
                       dipsPerfectScrollbar>

                    <!-- FECHA    -->
                    <ng-container matColumnDef="fecha">
                        <mat-header-cell *matHeaderCellDef mat-sort-header>Fecha</mat-header-cell>
                        <mat-cell *matCellDef="let item">
                            <p class="text-truncate">{{item.fecha.toDate() | date:'short'}}</p>
                        </mat-cell>
                    </ng-container>

                    <!-- ENCARGADO    -->
                    <ng-container matColumnDef="encargado">
                        <mat-header-cell *matHeaderCellDef>Encargado</mat-header-cell>
                        <mat-cell *matCellDef="let item">
                            <p class="text-truncate">{{item.emailEncargado}}</p>
                        </mat-cell>
                    </ng-container>

                    <!-- INGRESOS -->
                    <ng-container matColumnDef="ingresos">
                        <mat-header-cell *matHeaderCellDef fxHide fxShow.gt-md>Ingresos</mat-header-cell>
                        <mat-cell *matCellDef="let item" fxHide fxShow.gt-md>
                            <p class="text-truncate">
                                {{item.ingresos}}
                            </p>
                        </mat-cell>
                    </ng-container>

                    <!-- EGRESOS -->
                    <ng-container matColumnDef="egresos">
                        <mat-header-cell *matHeaderCellDef fxHide fxShow.gt-md>Egresos</mat-header-cell>
                        <mat-cell *matCellDef="let item" fxHide fxShow.gt-md>
                            <p class="text-truncate">
                                {{item.egresos}}
                            </p>
                        </mat-cell>
                    </ng-container>

                    <!-- SALDOS -->
                    <ng-container matColumnDef="saldo">
                        <mat-header-cell *matHeaderCellDef fxHide fxShow.gt-md>Saldos</mat-header-cell>
                        <mat-cell *matCellDef="let item" fxHide fxShow.gt-md>
                            <p class="text-truncate">
                                {{item.saldo}}
                            </p>
                        </mat-cell>
                    </ng-container>
                    
                    <mat-header-row *matHeaderRowDef="displayedColumns; sticky:true"></mat-header-row>

                    <mat-row *matRowDef="let fila; columns: displayedColumns;"
                        class="fila"
                         [routerLink]="'/principal/caja/form/'+fila.id"
                         matRipple>
                    </mat-row>


                </mat-table>

            </mat-datasource>    
        </div>
