<div id="mail-confirm" fxLayout="column">

    <div id="mail-confirm-form-wrapper" fxLayout="column" fxLayoutAlign="center center">

        <div id="mail-confirm-form" [@animate]="{value:'*',params:{duration:'300ms',y:'100px'}}">

            <div class="logo">
                <mat-icon class="mat-accent s-96">email</mat-icon>
            </div>

            <div class="title">Confirme su dirección de email!</div>

            <div class="subtitle">
                <p>
                    Un e-mail de confirmación ha sido enviado a <b>{{ email }}</b>.
                </p>
                <p>
                    Chequee su casilla de email y haga click en el link "Confirmo mi email" para confirmar su email.
                </p>
            </div>

            <div class="message">
                <a class="link" [routerLink]="'/sesion/login'">Retroceder a página de Inicio</a>
            </div>

        </div>

    </div>

</div>
