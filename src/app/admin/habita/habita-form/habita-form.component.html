<div class="habita-content-wrapper">
    <mat-toolbar matDialogTitle class="mat-accent m-0">
        <mat-toolbar-row fxLayout="row" fxLayoutAlign="space-between center">
            <span class="title dialog-title">{{dialogoTitulo}}</span>
            <button mat-icon-button (click)="matDialogRef.close()" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
        </mat-toolbar-row>

        <mat-toolbar-row class="toolbar-bottom py-16" fxLayout="column" fxLayoutAlign="center center">
            <!-- <img [src]="dato.avatar" class="avatar dato-avatar huge m-0" -->
                 <!-- [alt]="dato.nombre"/> -->
            <!-- <div class="dato-nombre mt-8">{{dato.nombre}}</div> -->
        </mat-toolbar-row>
    </mat-toolbar>

    <div mat-dialog-content class="p-24 pb-0 m-0" dipsPerfectScrollbar>

        <form [formGroup]="datoForm">

            <!-- NOMBRE -->
            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Nombre</mat-label>
                    <mat-icon matSuffix class="secondary-text">meeting_room</mat-icon>
                    <input name="nombre" formControlName="nombre" matInput required>
                    <!-- <mat-error *ngIf="f.nombre.errors && 
                                    f.nombre.errors.nombre-existe">
                        Esta Habitación ya Existe
                    </mat-error> -->
                </mat-form-field>
            </div>

            <!-- IMPORTE -->
            <div fxLayout="row" fxLayoutAlign="start start">
                <mat-form-field appearance="outline" fxFlex>
                    <mat-label>Valor</mat-label>
                    <mat-icon matSuffix class="secondary-text">monetization_on</mat-icon>
                    <input matInput placeholder="Valor" 
                           name="valor" 
                           formControlName="valor" 
                           type="number"
                           required>
                    <span matPrefix>$&nbsp;</span>       
                </mat-form-field>
            </div>
        </form>

    </div>

    <div mat-dialog-actions class="m-0 p-16" fxLayout="row" fxLayoutAlign="end center">

        <!-- <button *ngIf="accion === 'editar'"
                mat-button
                class="mr-8"
                (click)="matDialogRef.close(['delete',datoForm])"
                aria-label="Borrar"
                matTooltip="Borrar">
            BORRAR
        </button> -->

        <!-- <button *ngIf="accion !== 'editar'"
                mat-button
                class="save-button"
                (click)="matDialogRef.close(datoForm)"
                [disabled]="datoForm.invalid"
                aria-label="SALVAR">
            AGREGAR
        </button> -->

        <button *ngIf="accion === 'editar'"
                mat-button
                class="save-button"
                (click)="matDialogRef.close(['save',datoForm])"
                [disabled]="datoForm.invalid"
                aria-label="SALVAR">
            SALVAR
        </button>

    </div>
</div>
